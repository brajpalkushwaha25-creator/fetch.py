name: daily-update
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python fetch.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add data.json
          git commit -m "update" || exit 0
          git push
